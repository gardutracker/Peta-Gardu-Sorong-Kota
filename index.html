<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PLN Nusa Daya — Peta Gardu Sorong</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --blue:#0877d1; --blue2:#0759a8; --cyan:#00d4ff; --bg:#eef5fb;
  --card:rgba(255,255,255,.94); --text:#122033; --muted:#66758a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.header{
  position:relative;z-index:1000;padding:12px 16px;
  background:linear-gradient(135deg,#0759a8,#0877d1 55%,#00a9e8);
  color:white;box-shadow:0 5px 22px rgba(0,55,110,.24)
}
.brand{display:flex;align-items:center}
.logo{width:76px;height:44px;border-radius:10px;background:rgba(255,255,255,.08);
 display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.20);padding:2px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.title{font-size:18px;font-weight:850;line-height:1.1}.subtitle{font-size:11px;opacity:.85;margin-top:3px}
.search-wrap{margin-top:10px;display:flex;gap:8px}
.search{flex:1;border:0;outline:0;border-radius:13px;padding:12px 14px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn{border:0;border-radius:13px;padding:0 15px;font-weight:800;background:white;color:#0759a8;cursor:pointer}
.main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
.panel{
 position:absolute;z-index:900;left:14px;top:14px;width:min(360px,calc(100vw - 28px));
 background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);
 border-radius:18px;box-shadow:0 12px 35px rgba(24,53,80,.2);overflow:hidden
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#dce7f1}
.stat{padding:11px;background:rgba(255,255,255,.94);text-align:center}
.stat b{display:block;font-size:19px;color:var(--blue2)} .stat span{font-size:10px;color:var(--muted)}
.list{max-height:calc(100dvh - 250px);overflow:auto}
.item{padding:11px 13px;border-bottom:1px solid #e7edf3;cursor:pointer;transition:.15s}
.item:hover{background:#eef7ff}.code{font-weight:850;color:#0759a8;font-size:13px}.addr{font-size:11px;margin-top:3px;line-height:1.35}
.meta{font-size:10px;color:var(--muted);margin-top:5px}
.mobile-toggle{
 display:none;position:absolute;z-index:1001;right:14px;bottom:16px;border:0;border-radius:50%;
 width:52px;height:52px;background:#0877d1;color:#fff;font-size:22px;box-shadow:0 8px 22px rgba(0,80,150,.3)
}
.gardu-marker{position:relative;width:42px;height:42px}
.gardu-icon{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));}
.gardu-dot{display:none;width:16px;height:16px;border-radius:50%;background:#00c853;border:3px solid #fff;
 box-shadow:0 0 0 4px rgba(0,200,83,.30),0 3px 12px rgba(0,120,50,.40);position:absolute;left:3px;top:3px}
.gardu-pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid #00e676;animation:pulse 1.8s ease-out infinite;opacity:.75}
@keyframes pulse{0%{transform:scale(.45);opacity:.85}80%,100%{transform:scale(1.65);opacity:0}}
.leaflet-popup-content{margin:13px 15px}.popup h3{margin:0 0 5px;color:#0759a8;font-size:16px}
.popup p{margin:5px 0;font-size:12px}.popup .coord{font-family:ui-monospace,monospace;font-size:10px;color:#536579}
.navbtn{display:inline-block;margin-top:8px;padding:8px 10px;border-radius:9px;background:#0877d1;color:white!important;text-decoration:none;font-size:11px;font-weight:800}
.notice{padding:10px 13px;font-size:11px;color:#526579;background:#f7fbff;border-bottom:1px solid #e7edf3}
.map-modes{
 position:absolute;z-index:950;right:14px;top:14px;display:flex;gap:6px;
 background:rgba(255,255,255,.96);padding:5px;border-radius:13px;
 box-shadow:0 8px 22px rgba(24,53,80,.22);backdrop-filter:blur(10px)
}
.map-mode{
 border:0;border-radius:9px;padding:8px 10px;background:transparent;color:#29435e;
 font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap
}
.map-mode:hover{background:#eef7ff}
.map-mode.active{background:#0877d1;color:#fff}
.search-empty{padding:16px 13px;color:#66758a;font-size:11px;line-height:1.45}
.search-result{border-left:4px solid #0877d1}

@media(max-width:700px){
 .panel{left:10px;right:10px;width:auto;top:10px;display:none}
 .panel.open{display:block}
 .list{max-height:48dvh}
 .mobile-toggle{display:block}
}

.map-switch{position:absolute;z-index:950;top:14px;right:14px;display:flex;gap:5px;padding:5px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:13px;box-shadow:0 8px 24px rgba(24,53,80,.22)}
.map-switch button{border:0;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:850;color:#40546b;background:#eef4f8;cursor:pointer;transition:.15s}.map-switch button:hover{background:#dcebf8}.map-switch button.active{background:#0877d1;color:#fff;box-shadow:0 3px 9px rgba(8,119,209,.28)}
</style>
</head>

<div class="app">

  </section>
  <button class="mobile-toggle" onclick="togglePanel()">☰</button>
</main>
</div>

function popup(r){
 const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`;
 return `<div class="popup">
   <h3>${esc(r.code)}</h3>
   <p><b>${esc(r.address)}</b></p>
   <p>Wilayah: ${esc(r.area)} • Kapasitas: ${esc(r.capacity || '-')}</p>
   <p>Tahun: ${r.year || '-'} ${r.status ? '• Status: '+esc(r.status) : ''}</p>
   <div class="coord">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</div>
   <a class="navbtn" href="${mapsUrl}" target="_blank" rel="noopener">Buka Navigasi Google Maps ↗</a>
 </div>`;
}

function addMarkers(){
 gardu.forEach((r,i)=>{
   const m=L.marker([r.lat,r.lng],{icon:icon(),title:r.code});
   m.bindPopup(popup(r),{maxWidth:300});
   m.addTo(map);
   markers.push({data:r,marker:m});
   markerByCode.set(r.code,m);
 });
}

function searchScore(r,q){
 const code=String(r.code||'').toLowerCase();
 const address=String(r.address||'').toLowerCase();
 const area=String(r.area||'').toLowerCase();
 const hay=[code,address,area].join(' ');
 if(code===q) return 1000;
 if(code.startsWith(q)) return 900;
 if(code.includes(q)) return 800;
 if(address.startsWith(q)) return 700;
 if(address.includes(q)) return 600;
 if(area===q) return 500;
 if(area.startsWith(q)) return 400;
 if(area.includes(q)) return 300;
 if(hay.includes(q)) return 100;
 return -1;
}

function getBestResult(filter=''){
 const q=filter.trim().toLowerCase();
 if(!q) return null;
 return gardu
   .map(r=>({r,score:searchScore(r,q)}))
   .filter(x=>x.score>=0)
   .sort((a,b)=>{
      if(b.score!==a.score) return b.score-a.score;
      return String(a.r.code).localeCompare(String(b.r.code));
   })[0]?.r || null;
}

function renderList(filter=''){
 const q=filter.trim();
 const list=document.getElementById('list');

 if(!q){
   list.innerHTML='';
   document.getElementById('total').textContent=gardu.length;
   return null;
 }

 const best=getBestResult(q);

 if(!best){
   list.innerHTML='<div class="search-empty">Tidak ada gardu yang cocok.<br>Coba kode SRG, alamat, atau wilayah lain.</div>';
   document.getElementById('total').textContent='0';
   return null;
 }

 list.innerHTML=`<div class="item search-result" onclick="focusGardu('${escAttr(best.code)}')">
   <div class="code">${esc(best.code)}</div>
   <div class="addr">${esc(best.address)}</div>
   <div class="meta">${esc(best.area)} • ${best.lat.toFixed(6)}, ${best.lng.toFixed(6)}</div>
 </div>`;
 document.getElementById('total').textContent='1';
 return best;
}

function focusGardu(code){
 const m=markerByCode.get(code);
 if(!m)return;
 map.setView(m.getLatLng(),18,{animate:true,duration:.7});
 m.openPopup();
 if(innerWidth<=700) document.getElementById('panel').classList.remove('open');
}


function locateMe(){
 if(!navigator.geolocation){alert('GPS tidak tersedia di perangkat ini.');return;}
 navigator.geolocation.getCurrentPosition(p=>{
   const ll=[p.coords.latitude,p.coords.longitude];
   map.setView(ll,17,{animate:true});
   L.circleMarker(ll,{radius:8,weight:3}).addTo(map).bindPopup('Lokasi Anda').openPopup();
 },()=>alert('Izin lokasi belum diberikan atau lokasi tidak tersedia.'));
}
function togglePanel(){document.getElementById('panel').classList.toggle('open')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(s){return esc(s).replace(/`/g,'&#096;')}

let searchTimer=null;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const value=e.target.value;
  renderList(value);

  if(!value.trim()) return;

  searchTimer=setTimeout(()=>{
    const best=getBestResult(value);
    if(best) focusGardu(best.code);
  },180);
});

document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    clearTimeout(searchTimer);
    const best=getBestResult(e.target.value);
    if(best) focusGardu(best.code);
  }
});

addMarkers();
renderList('');
document.getElementById('pln').textContent=gardu.filter(r=>String(r.status).toUpperCase()==='PLN').length;
document.getElementById('area').textContent=new Set(gardu.map(r=>r.area).filter(Boolean)).size;
</script>
